[[dependencies.projecte]]
  modId="minecraft"
  mandatory=true
  versionRange="${mc_version}"
  side="BOTH"
[[dependencies.projecte]]
  modId="forge"
  mandatory=true
  versionRange="${forge_version}"
  side="BOTH"
[[dependencies.projecte]]
  modId="crafttweaker"
  mandatory=false
  versionRange="${crafttweaker_version}"
