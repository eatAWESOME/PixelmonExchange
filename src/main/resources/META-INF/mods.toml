license="MIT"

[[mods]]
  modId="projecte"
  version="${version}"
  displayName="PixelmonExchange"
  displayURL="https://github.com/eatAWESOME/PixelmonExchange"
  logoFile="logo.png"
  authors="Alden Tilley"
  credits="EE2 creator - x3n0ph0b3, EE2 GUI Textures - MidnightLightning, Former Texture Artist - Magic Banana, Project E Developers - SinKillerJ, MaPePeR, williewillus, Lilylicious, pupnewfster"
